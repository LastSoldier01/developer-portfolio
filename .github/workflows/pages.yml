name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-build-secret
      DEBUG: "False"
      FORCE_SCRIPT_NAME: /developer-portfolio
      STATIC_URL: /developer-portfolio/static/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Migrate temporary database
        run: python manage.py migrate

      - name: Load public portfolio data
        run: python manage.py loaddata projects/fixtures/public_portfolio.json

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Build static site
        run: python manage.py build_static_site --base-path /developer-portfolio

      - name: Validate static output
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/projects/video-editing-adobe-premiere-pro/index.html
          test -f dist/projects/django-blog-platform/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4